<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d3d3d" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>
    <filter id="noise5">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1000" height="1200" fill="url(#g5)" />
  <rect width="1000" height="1200" filter="url(#noise5)" opacity="0.5"/>
  <text x="50%" y="52%" font-family="Arial, sans-serif" font-size="220" fill="#ffffff" fill-opacity="0.18" text-anchor="middle" font-weight="700">05</text>
</svg>